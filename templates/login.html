<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MediRAG - {{ get_text('login') }}</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 400px;
      width: 90%;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 40px 35px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      animation: slideUp 0.5s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo-icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .logo-text {
      font-size: 24px;
      font-weight: 600;
      color: #667eea;
    }

    h2 {
      text-align: center;
      margin-bottom: 10px;
      color: #333;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #4a5568;
      font-weight: 500;
      font-size: 14px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      color: #a0aec0;
    }

    input {
      width: 100%;
      padding: 15px 15px 15px 45px;
      border: 2px solid #e2e8f0;
      border-radius: 50px;
      font-size: 16px;
      transition: all 0.3s ease;
      outline: none;
    }

    input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
    }

    .error {
      background: #fed7d7;
      color: #c53030;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      text-align: center;
      border-left: 4px solid #c53030;
    }

    button {
      width: 100%;
      padding: 15px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    button:hover {
      background: #5a67d8;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102,126,234,0.3);
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #718096;
      font-size: 14px;
    }

    .footer a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    .footer a:hover {
      color: #5a67d8;
      text-decoration: underline;
    }

    .admin-note {
      margin-top: 20px;
      padding: 15px;
      background: #f0f3ff;
      border-radius: 10px;
      text-align: center;
      font-size: 13px;
      color: #4a5568;
    }

    .admin-note strong {
      color: #667eea;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: white;
      text-decoration: none;
      font-size: 14px;
      opacity: 0.9;
      transition: opacity 0.3s ease;
    }

    .back-link:hover {
      opacity: 1;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo">
        <div class="logo-icon">🏥</div>
        <div class="logo-text">MediRAG</div>
      </div>
      <div id="google_translate_element"></div>
      <h2>{{ get_text('welcome_back') }}</h2>
      <p class="subtitle">{{ get_text('sign_in_to') }}</p>
      
      {% if error %}
      <div class="error">
        ⚠️ {{ error }}
      </div>
      {% endif %}
      
      <form method="POST">
        <div class="form-group">
          <label>{{ get_text('username') }}</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input name="username" placeholder="{{ get_text('enter_username') }}" required autofocus />
          </div>
        </div>
        
        <div class="form-group">
          <label>{{ get_text('password') }}</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input name="password" type="password" placeholder="{{ get_text('enter_password') }}" required />
          </div>
        </div>
        
        <button type="submit">{{ get_text('login') }}</button>
      </form>
      
      <div class="footer">
        {{ get_text('no_account') }} <a href="/register">{{ get_text('create_one') }}</a>
      </div>
      
      <div class="admin-note">
        <strong>{{ get_text('admin_access') }}:</strong> {{ get_text('admin_note') }}
      </div>
    </div>
    
    <div style="text-align: center;">
      <a href="/" class="back-link">{{ get_text('back_to_home') }}</a>
    </div>
  </div>
  <script>
    function googleTranslateElementInit() {
      new google.translate.TranslateElement(
        {
          pageLanguage: 'en',          // your page's default language
          includedLanguages: 'en,hi,ta,kn', // optional
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE
        },
        'google_translate_element'
      );
    }
  </script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
