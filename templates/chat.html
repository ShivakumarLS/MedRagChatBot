<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MediRAG - Chat Assistant</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #333;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Header */
    .header {
      background: white;
      border-radius: 20px 20px 0 0;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 600;
      color: #667eea;
    }

    .logo-icon {
      font-size: 28px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .username {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: #f0f3ff;
      border-radius: 50px;
      color: #667eea;
      font-weight: 500;
    }

    .logout-btn {
      padding: 8px 16px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .logout-btn:hover {
      background: #5a67d8;
      transform: translateY(-2px);
    }

    /* Controls Bar */
    .controls {
      background: rgba(255,255,255,0.95);
      padding: 15px 30px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      border-bottom: 1px solid #e2e8f0;
    }

    .control-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      background: #f7fafc;
      border-radius: 50px;
      border: 1px solid #e2e8f0;
    }

    .control-pill label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 14px;
      color: #4a5568;
    }

    .control-pill input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .mic-btn {
      padding: 8px 16px;
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      border-radius: 50px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .mic-btn:hover {
      background: #edf2f7;
    }

    .mic-on {
      background: #c6f6d5;
      border-color: #48bb78;
      color: #22543d;
    }

    .mic-status {
      font-size: 12px;
      color: #718096;
    }

    .stop-speech {
      padding: 8px 16px;
      background: #fed7d7;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-size: 14px;
      color: #c53030;
      transition: all 0.3s ease;
    }

    .stop-speech:hover {
      background: #feb2b2;
    }

    /* Chat Container */
    .chat-container {
      background: white;
      border-radius: 0 0 20px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      overflow: hidden;
    }

    #chat {
      height: 500px;
      overflow-y: auto;
      padding: 30px;
      background: #f8fafc;
    }

    /* Message Styles */
    .message {
      margin-bottom: 25px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .user-message {
      display: flex;
      justify-content: flex-end;
    }

    .bot-message {
      display: flex;
      justify-content: flex-start;
    }

    .message-bubble {
      max-width: 80%;
      padding: 15px 20px;
      border-radius: 20px;
      position: relative;
    }

    .user-message .message-bubble {
      background: #667eea;
      color: white;
      border-bottom-right-radius: 5px;
    }

    .bot-message .message-bubble {
      background: white;
      color: #333;
      border-bottom-left-radius: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .message-sender {
      font-size: 12px;
      margin-bottom: 5px;
      font-weight: 600;
    }

    .user-message .message-sender {
      text-align: right;
      color: rgba(255,255,255,0.8);
    }

    .bot-message .message-sender {
      color: #667eea;
    }

    .message-content {
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .message-meta {
      font-size: 11px;
      margin-top: 8px;
      opacity: 0.7;
    }

    .user-message .message-meta {
      text-align: right;
      color: rgba(255,255,255,0.7);
    }

    .bot-message .message-meta {
      color: #718096;
    }

    /* Action Buttons */
    .message-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .action-btn {
      padding: 6px 12px;
      border: none;
      border-radius: 50px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #f1f5f9;
      color: #4a5568;
    }

    .action-btn:hover {
      background: #e2e8f0;
    }

    .action-btn.speak {
      background: #667eea;
      color: white;
    }

    .action-btn.speak:hover {
      background: #5a67d8;
    }

    .action-btn.helpful {
      background: #c6f6d5;
      color: #22543d;
    }

    .action-btn.not-helpful {
      background: #fed7d7;
      color: #c53030;
    }

    /* Input Area */
    .input-area {
      padding: 20px 30px;
      background: white;
      border-top: 1px solid #e2e8f0;
      display: flex;
      gap: 15px;
    }

    #text {
      flex: 1;
      padding: 15px 20px;
      border: 2px solid #e2e8f0;
      border-radius: 50px;
      font-size: 16px;
      transition: all 0.3s ease;
      outline: none;
    }

    #text:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
    }

    #sendBtn {
      padding: 15px 35px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    #sendBtn:hover:not(:disabled) {
      background: #5a67d8;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102,126,234,0.4);
    }

    #sendBtn:disabled {
      background: #cbd5e0;
      cursor: not-allowed;
    }

    /* Thinking Animation */
    .thinking-dots {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }

    .thinking-dots span {
      width: 8px;
      height: 8px;
      background: #667eea;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .thinking-dots span:nth-child(1) { animation-delay: -0.32s; }
    .thinking-dots span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* Scrollbar */
    #chat::-webkit-scrollbar {
      width: 8px;
    }

    #chat::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    #chat::-webkit-scrollbar-thumb {
      background: #cbd5e0;
      border-radius: 4px;
    }

    #chat::-webkit-scrollbar-thumb:hover {
      background: #a0aec0;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .container {
        padding: 10px;
      }

      .header {
        flex-direction: column;
        gap: 15px;
        text-align: center;
      }

      .controls {
        justify-content: center;
      }

      .message-bubble {
        max-width: 90%;
      }

      .input-area {
        flex-direction: column;
      }

      #sendBtn {
        width: 100%;
      }
    }

    /* Disclaimer */
    .disclaimer {
      background: #fff3cd;
      color: #856404;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <span class="logo-icon">🏥</span>
        <span>MediRAG Assistant</span>
        <div id="google_translate_element"></div>
      </div>
      <div class="user-info">
        <div class="username">
          <span>👤</span>
          <span>{{ username }}</span>
          {% if is_admin %}
          <span style="background: #667eea; color: white; padding: 2px 8px; border-radius: 50px; font-size: 10px;">Admin</span>
          {% endif %}
        </div>
        <form method="POST" action="/logout">
          <button type="submit" class="logout-btn">Logout</button>
        </form>
      </div>
    </div>

    <div class="controls">
      <div class="control-pill">
        <label>
          <input id="speakToggle" type="checkbox" />
          <span>🔊 Text-to-Speech</span>
        </label>
      </div>
      
      <button id="stopSpeakBtn" class="stop-speech">⏹️ Stop Speaking</button>
      
      <button id="micBtn" class="mic-btn">
        <span>🎙️</span>
        <span>Voice Input</span>
      </button>
      <span class="mic-status" id="micStatus">Offline</span>
    </div>

    <div class="chat-container">
      <div id="chat"></div>

      <div class="input-area">
        <input id="text" placeholder="Ask a medical question..." />
        <button id="sendBtn" onclick="sendMsg()">Send</button>
      </div>
    </div>

    <div class="disclaimer">
      ⚕️ This is an AI assistant for informational purposes only. Always consult healthcare professionals for medical advice.
    </div>
  </div>

  <script>
    const IS_ADMIN = {{ 'true' if is_admin else 'false' }};

    const chat = document.getElementById("chat");
    const text = document.getElementById("text");
    const sendBtn = document.getElementById("sendBtn");

    // Text-to-Speech
    const speakToggle = document.getElementById("speakToggle");
    const stopSpeakBtn = document.getElementById("stopSpeakBtn");

    function stopSpeaking() {
      try { window.speechSynthesis.cancel(); } catch(e) {}
    }

    function speakText(raw) {
      if (!raw) return;
      stopSpeaking();

      const cleaned = String(raw)
        .replace(/Sources:\s.*$/gm, "")
        .replace(/Latency:\s.*$/gm, "")
        .replace(/⚠️.*$/gm, "")
        .trim();

      if (!cleaned) return;

      const utter = new SpeechSynthesisUtterance(cleaned);
      utter.rate = 1.0;
      utter.pitch = 1.0;
      utter.volume = 1.0;
      window.speechSynthesis.speak(utter);
    }

    stopSpeakBtn.addEventListener("click", stopSpeaking);

    // Speech-to-Text
    const micBtn = document.getElementById("micBtn");
    const micStatus = document.getElementById("micStatus");

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.interimResults = true;
      recognition.continuous = false;

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add("mic-on");
        micStatus.textContent = "Listening...";
      };

      recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove("mic-on");
        micStatus.textContent = "Offline";
      };

      recognition.onerror = (e) => {
        micStatus.textContent = "Error: " + (e.error || "unknown");
      };

      recognition.onresult = (event) => {
        let interim = "";
        let finalText = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalText += transcript;
          else interim += transcript;
        }
        text.value = (finalText || interim).trim();
      };

      micBtn.addEventListener("click", () => {
        if (isListening) { recognition.stop(); return; }
        stopSpeaking();
        recognition.start();
      });
    } else {
      micBtn.disabled = true;
      micStatus.textContent = "Not supported";
    }

    // Chat helpers
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
      }[m]));
    }

    function addUser(content) {
      const div = document.createElement("div");
      div.className = "message user-message";
      div.innerHTML = `
        <div class="message-bubble">
          <div class="message-sender">You</div>
          <div class="message-content">${escapeHtml(content)}</div>
          <div class="message-meta">${new Date().toLocaleTimeString()}</div>
        </div>
      `;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function addBot(content, sources, latency_ms, exchange) {
      const bannerText = (typeof exchange === "string") ? exchange : null;
      const exchangeObj = (exchange && typeof exchange === "object") ? exchange : null;

      const div = document.createElement("div");
      div.className = "message bot-message";

      const src = (sources && sources.length) ? `Sources: ${sources.join(" | ")}` : "";
      const meta = latency_ms ? `${latency_ms}ms${src ? " • " + src : ""}` : (src || "");
      const showRate = exchangeObj && exchangeObj.user_message && exchangeObj.bot_reply;

      div.innerHTML = `
        <div class="message-bubble">
          <div class="message-sender">MediRAG Assistant</div>
          <div class="message-content">${escapeHtml(content)}</div>
          <div class="message-actions">
            <button class="action-btn speak">🔊 Listen</button>
            ${showRate ? `
              <button class="action-btn helpful">👍 Helpful</button>
              <button class="action-btn not-helpful">👎 Not Helpful</button>
            ` : ``}
          </div>
          ${meta ? `<div class="message-meta">${escapeHtml(meta)}</div>` : ""}
          ${bannerText ? `<div class="message-meta">${escapeHtml(bannerText)}</div>` : ""}
        </div>
      `;

      const buttons = div.querySelectorAll(".action-btn");
      buttons[0].addEventListener("click", () => speakText(content));

      if (showRate) {
        buttons[1].addEventListener("click", () => rate(true, exchangeObj));
        buttons[2].addEventListener("click", () => rate(false, exchangeObj));
      }

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;

      if (speakToggle.checked) speakText(content);
    }

    function addThinking() {
      const id = "thinking-" + Date.now();
      const div = document.createElement("div");
      div.className = "message bot-message";
      div.id = id;
      div.innerHTML = `
        <div class="message-bubble">
          <div class="message-sender">MediRAG Assistant</div>
          <div class="message-content">
            <div class="thinking-dots">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
        </div>
      `;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return id;
    }

    function removeThinking(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    async function loadHistory() {
      const res = await fetch("/api/history");
      const data = await res.json();
      if (!data || data.error) return;

      const history = data.history || [];
      if (history.length === 0) {
        addBot(
          "👋 Hello! I'm your MediRAG medical assistant. Ask me about symptoms, treatments, medications, or any health-related questions. I'll provide information based on trusted medical sources.",
          [],
          0,
          null
        );
        return;
      }

      for (const h of history) {
        if (h.role === "user") addUser(h.content);
        else addBot(h.content, [], h.latency_ms || 0, null);
      }
    }

    async function sendMsg() {
      const msg = text.value.trim();
      if (!msg) return;

      if (recognition && isListening) recognition.stop();
      stopSpeaking();

      addUser(msg);
      text.value = "";

      sendBtn.disabled = true;
      const thinkingId = addThinking();

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({message: msg})
        });

        const data = await res.json();

        removeThinking(thinkingId);
        sendBtn.disabled = false;

        if (data.error) {
          addBot(data.error, [], 0, {user_message: msg, bot_reply: data.error, latency_ms: 0});
          return;
        }

        addBot(data.reply || "", data.sources || [], data.latency_ms || 0, data.exchange || null);
      } catch (e) {
        removeThinking(thinkingId);
        sendBtn.disabled = false;
        addBot("Sorry, I encountered an error: " + (e?.message || e), [], 0, null);
      }
    }

    async function rate(helpful, exchange) {
      const payload = {
        helpful,
        user_message: exchange.user_message,
        bot_reply: exchange.bot_reply,
        latency_ms: exchange.latency_ms
      };

      const res = await fetch("/api/rate", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      if (data.status === "ok") {
        alert("✅ Thank you for your feedback!");
      } else {
        alert("❌ Could not save feedback: " + (data.error || "unknown"));
      }
    }

    text.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMsg();
      }
    });

    loadHistory();
  </script>
  <script>
    function googleTranslateElementInit() {
      new google.translate.TranslateElement(
        {
          pageLanguage: 'en',          // your page's default language
          includedLanguages: 'en,hi,ta,kn', // optional
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE
        },
        'google_translate_element'
      );
    }
  </script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
